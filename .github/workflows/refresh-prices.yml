name: Refresh crypto prices

# Background refresh + alerts without a self-hosted scheduler.
# Uses this repository's production Vercel deployment by default. Self-hosted
# installations can override it with a repository variable:
#   APP_URL      e.g. https://portfolio.example.com
# If the server has CRON_SECRET configured, add the same value as a repository
# secret named CRON_SECRET. Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/refresh-prices
        env:
          APP_URL: ${{ vars.APP_URL || 'https://portfolio2-king.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -o pipefail
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/refresh-prices"
